name: build-oneplus13t-kernel

# 一加 13T (PKX110 / sun / SM8750) 官方内核全量编译 —— 跑在 GitHub 托管的 4 vCPU / 16 GB runner 上。
# 本机只有 4 核 / 7.2 GB（还被 QQ 机器人占着 4.5 G），全量 `sun perf` 必 OOM，所以编译交给这里。
#
# 触发：Actions 页面 Run workflow，或 push 到 main 且改动落在 patches/ / scripts/ 下。
# 产出：Image / boot.img / dtbo.img / 359 个 .ko / vendor_dlkm.modules.load + build.log

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'variants_type'
        required: true
        default: 'perf'
        type: choice
        options: [perf, consolidate]
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build-oneplus13t.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VARIANT: ${{ inputs.variant || 'perf' }}
  TREE: ${{ github.workspace }}/oneplus13t-kernel
  DL: ${{ github.workspace }}/_dl

jobs:
  build:
    # 官方基线在 8 核上要 3h12m；4 vCPU 留足余量
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 实测 runner 是 146 G 盘 / 118 G 可用、15 GiB 内存，不需要 free-disk-space 那套腾空间操作
      - name: Report runner
        run: |
          echo "cores: $(nproc)"; echo "mem:"; free -h; echo "disk:"; df -h /

      # 3.01 GiB 依赖：按 deps.json 的 hash 缓存，命中后重建省 5-8 分钟
      - name: Cache deps (3.0 GiB)
        uses: actions/cache@v4
        with:
          path: _dl
          key: 13t-deps-${{ hashFiles('scripts/deps.json') }}
          restore-keys: 13t-deps-

      - name: Host packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git python3 rsync zip unzip bc bzip2 cpio flex bison \
            libssl-dev libelf-dev kmod device-tree-compiler file

      # 额外 swap 只是保险：runner 已有 3 G swap、15 GiB 内存。
      # 注意 /swapfile 已被 runner 占用（fallocate 会报 Text file busy），必须换一个文件名；
      # 而且这一步失败不该阻断编译。
      - name: Extra swap (best effort)
        continue-on-error: true
        run: |
          free -h; swapon --show || true
          SW=/swapfile_extra
          sudo swapoff "$SW" 2>/dev/null || true
          sudo rm -f "$SW"
          sudo fallocate -l 8G "$SW" || sudo dd if=/dev/zero of="$SW" bs=1M count=8192 status=none
          sudo chmod 600 "$SW" && sudo mkswap "$SW" && sudo swapon "$SW" || echo "swap add failed, continuing"
          swapon --show; free -h

      - name: Assemble official tree (35 deps)
        run: |
          python3 scripts/assemble.py --root "$TREE" --arch-dir "$DL" --jobs 4
          echo "---- tree size:"; du -sh "$TREE"
          echo "---- files:"; find "$TREE" -type f | wc -l

      - name: Apply local patches (optional)
        run: |
          cd "$TREE"
          shopt -s nullglob
          ps=("$GITHUB_WORKSPACE"/patches/*.patch)
          if [ ${#ps[@]} -eq 0 ]; then echo "no patches/ -- zero-change baseline"; exit 0; fi
          for p in "${ps[@]}"; do
            echo "== applying $(basename "$p")"
            patch -p1 --forward < "$p" || { echo "PATCH FAILED: $p"; exit 1; }
          done

      # oplus_setup.sh 把 JAVA_HOME 写死成 ${TOPDIR}/prebuilts/jdk/jdk21/linux-x86，
      # 但依赖里只有 jdk11，且 prebuilts 在 kernel_platform/ 下而不是树根。
      # 用软链补齐，不改源码（kleaf/workspace.bzl 用的就是 jdk11，版本是对的）。
      # 另外 llvm-binutils-stable/ 里 20 个工具全指向不存在的 clang-r522817，
      # 而 oplus_setup.sh 的 STRIP 变量就走这条路 —— 一条软链全部修好。
      - name: Prepare prebuilts / JAVA_HOME / llvm-strip
        run: |
          cd "$TREE"
          [ -e prebuilts ] || ln -sfn "$TREE/kernel_platform/prebuilts" "$TREE/prebuilts"
          CL="$TREE/kernel_platform/prebuilts/clang/host/linux-x86"
          if [ ! -d "$CL/clang-r522817" ]; then
            ln -sfn clang-r510928 "$CL/clang-r522817"
            echo "linked clang-r522817 -> clang-r510928 (llvm-binutils-stable 依赖它)"
          fi
          if [ ! -d "$TREE/prebuilts/jdk/jdk21/linux-x86" ]; then
            ln -sfn "$TREE/prebuilts/jdk/jdk11" "$TREE/prebuilts/jdk/jdk21"
            echo "linked jdk21 -> jdk11"
          fi
          echo "---- llvm-strip:"; "$CL/llvm-binutils-stable/llvm-strip" --version | head -1
          echo "---- java:"; "$TREE/prebuilts/jdk/jdk21/linux-x86/bin/java" -version 2>&1 | head -1

      - name: Preflight
        run: |
          cd "$TREE"
          fail=0
          chk() { if [ -e "$2" ]; then echo "ok    $1"; else echo "MISS  $1  ($2)"; fail=1; fi; }
          chk "common/Makefile"                kernel_platform/common/Makefile
          chk "msm-kernel build.config.msm.sun" kernel_platform/msm-kernel/build.config.msm.sun
          chk "vendor/sun_perf.config"          kernel_platform/msm-kernel/arch/arm64/configs/vendor/sun_perf.config
          chk "oplus_build_kernel.sh"           kernel_platform/oplus/build/oplus_build_kernel.sh
          chk "prepare_vendor.sh"               kernel_platform/build/android/prepare_vendor.sh
          chk "clang-r510928"                   kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin/clang
          chk "llvm-strip"                      kernel_platform/prebuilts/clang/host/linux-x86/llvm-binutils-stable/llvm-strip
          chk "prebuilt python3"                kernel_platform/prebuilts/build-tools/path/linux-x86/python3
          chk "prebuilt cpio"                   kernel_platform/prebuilts/build-tools/path/linux-x86/cpio
          chk "lz4"                             kernel_platform/prebuilts/kernel-build-tools/linux-x86/bin/lz4
          chk "mkbootimg.py"                    kernel_platform/tools/mkbootimg/mkbootimg.py
          chk "unpack_bootimg.py"               kernel_platform/tools/mkbootimg/unpack_bootimg.py
          # 原厂镜像模板只影响"打包成 boot.img"这一步；缺了照样能编出 Image + 359 个 ko，
          # 那种情况用 AnyKernel3 zip 刷（AK3 自带打包逻辑，不需要原厂 boot.img）。所以只警告不中断。
          for p in kernel_platform/oplus/prebuild/origin_img kernel_platform/oplus/prebuild/boot_tmp; do
            [ -e "$p" ] && echo "ok    $p" || echo "WARN  $p 缺失 —— 只能出 Image+ko，用 AnyKernel3 刷"
          done
          echo "---- version:"
          sed -n 's/^VERSION = //p;s/^PATCHLEVEL = //p;s/^SUBLEVEL = //p' kernel_platform/common/Makefile | paste -sd. -
          echo "---- SIG_PROTECT in defconfigs (must be 'is not set'):"
          grep -H 'MODULE_SIG_PROTECT' kernel_platform/common/arch/arm64/configs/gki_defconfig \
                                     kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig || true
          echo "---- oplus/prebuild 内容:"
          ls -la kernel_platform/oplus/prebuild 2>/dev/null | head -15
          exit $fail

      - name: Build (${{ env.VARIANT }})
        run: |
          cd "$TREE"
          set -o pipefail
          bash kernel_platform/oplus/build/oplus_build_kernel.sh sun "$VARIANT" 2>&1 | tee build.log

      # 产物路径以 prepare_vendor.sh 头部注释为准（权威）：
      #   KP_OUT = ${ANDROID_BUILD_TOP}/device/qcom/sun-kernel   ← oplus_setup.sh 把 ANDROID_BUILD_TOP=树根
      #   $(KP_OUT)/Image            boot.img 用的内核
      #   $(KP_OUT)/*.ko             所有 DLKM（359 个）
      #   $(KP_OUT)/modules.load
      #   $(KP_OUT)/merged-dtbs/     dtb/dtbo
      # bazel 的中间 dist（kernel_platform/out/<branch>/dist）只是二传手。
      - name: Verify artifacts
        run: |
          O="$TREE/device/qcom/sun-kernel"
          echo "---- device/qcom/sun-kernel:"; ls -lh "$O" 2>/dev/null | head -30 || echo "  目录不存在"
          echo "---- ko 数量: $(ls "$O"/*.ko 2>/dev/null | wc -l)"
          echo "---- merged-dtbs:"; ls "$O/merged-dtbs" 2>/dev/null | head -10
          if [ -f "$O/Image" ]; then
            ls -lh "$O/Image"
            strings "$O/Image" | grep -m2 'Linux version 6\.6\.' || echo "  版本串没找到"
            echo "---- Image header:"; xxd -l 64 "$O/Image" | head -4
          else
            echo "!! $O/Image 不存在 —— 编译没走到拷贝环节"
            echo "---- 兜底搜索:"
            find "$TREE" -name Image -newermt '-6 hours' 2>/dev/null | head -10
            find "$TREE" -name '*.ko' 2>/dev/null | head -5
            exit 1
          fi
          echo "---- CONFIG_MODULE_SIG_PROTECT（必须 not set，否则 WiFi/BT 模块加载失败）:"
          grep -m1 'CONFIG_MODULE_SIG_PROTECT' "$O/.config" 2>/dev/null || \
            grep -m1 'CONFIG_MODULE_SIG_PROTECT' "$O/build_opts.txt" 2>/dev/null || echo "  (查不到，忽略)"

      - name: Collect outputs
        if: always()
        run: |
          O="$TREE/device/qcom/sun-kernel"
          A="$GITHUB_WORKSPACE/out-artifacts"
          mkdir -p "$A"
          # 关键文件
          cp -v "$O"/Image "$O"/System.map "$O"/.config "$O"/build_opts.txt "$A/" 2>/dev/null || true
          cp -v "$O"/modules.load "$O"/modules.blocklist "$O"/vendor_dlkm.modules.load \
                "$O"/vendor_boot.modules.load "$A/" 2>/dev/null || true
          cp -v "$O"/*.img "$A/" 2>/dev/null || true
          cp -rv "$O"/merged-dtbs "$A/" 2>/dev/null || true
          # 全部 ko（359 个，压缩后 100 MB 左右）
          if ls "$O"/*.ko >/dev/null 2>&1; then
            mkdir -p "$A/ko"; cp -v "$O"/*.ko "$A/ko/" 2>/dev/null | tail -3
            echo "ko 拷贝数: $(ls "$A/ko" | wc -l)"
          fi
          # bazel 中间 dist 也留一份清单，便于对照
          ls -d "$TREE"/kernel_platform/out/*/dist 2>/dev/null > "$A/dist-dirs.txt" || true
          cp -v "$TREE/build.log" "$A/" 2>/dev/null || true
          echo "---- 收集结果:"; du -sh "$A"; ls -lh "$A" | head -20

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus13t-${{ env.VARIANT }}-${{ github.run_number }}
          path: out-artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-fail-${{ github.run_number }}
          path: |
            ${{ env.TREE }}/build.log
            ${{ env.TREE }}/LOGDIR/**
          if-no-files-found: warn
          retention-days: 7
